<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Уроки — Каталог</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Montserrat", sans-serif;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-white text-stone-900 tracking-wide flex flex-col justify-between"
  >
    <!-- Шапка соберется здесь через JS -->
    <header
      id="global-header"
      class="border-b border-stone-100 bg-white/90 backdrop-blur-md sticky top-0 z-50"
    ></header>

    <!-- Текстовое описание -->
    <div class="max-w-5xl mx-auto mt-16 px-6 w-full">
      <span
        class="text-xs font-medium tracking-[0.4em] text-stone-400 uppercase block mb-3"
        >Обучение</span
      >
      <h1
        class="text-3xl font-light uppercase tracking-wider text-stone-900 mb-6"
      >
        Видео-уроки
      </h1>
      <div
        class="space-y-4 w-full text-stone-500 text-sm font-light leading-relaxed"
      >
        <p class="text-justify">
          Из моих video-уроков по фудстайлингу вы получите профессиональные
          знания и навыки фудстилиста...
        </p>
      </div>
    </div>

    <!-- Контейнер для карточек уроков -->
    <main class="max-w-5xl mx-auto w-full px-6 py-12 flex-grow mb-16">
      <div id="lessons-container" class="grid gap-8 md:grid-cols-2">
        <p
          id="loading-status"
          class="text-stone-400 text-xs uppercase tracking-widest animate-pulse font-medium"
        >
          Загрузка каталога...
        </p>
      </div>
    </main>

    <!-- Подвал соберется здесь через JS -->
    <footer
      id="global-footer"
      class="w-full border-t border-stone-100 bg-stone-50 py-8 text-stone-400 font-light"
    ></footer>

    <!-- Подключаем логику компонентов и загрузку уроков -->
    <script src="./components.js"></script>
    <script>
      const API_URL = "http://localhost:8000/lessons";
      const container = document.getElementById("lessons-container");
      const statusText = document.getElementById("loading-status");

      async function loadLessons() {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) throw new Error("Ошибка сервера");
          const result = await response.json();
          statusText.remove();

          if (result.items.length === 0) {
            container.innerHTML = `<div class="border border-stone-200 p-8 text-center col-span-2 bg-stone-50 text-xs uppercase tracking-widest text-stone-400 font-medium">Нет доступных уроков.</div>`;
            return;
          }

          for (let i = 0; i < result.items.length; i++) {
            const lesson = result.items[i];
            const card = document.createElement("div");
            card.className =
              "bg-white border border-stone-200/80 p-6 flex flex-col justify-between hover:shadow-sm transition rounded-none";
            card.innerHTML = `
                <div>
                    <span class="text-[10px] font-medium uppercase tracking-widest text-stone-400 block mb-2">Программа обучения</span>
                    <h2 class="text-base font-semibold text-stone-900 uppercase tracking-wide mb-4">${escapeHTML(lesson.title)}</h2>
                    ${
                      lesson.title_video_url
                        ? `
                      <div class="bg-stone-50 p-1 border border-stone-100 mb-4">
                        <video controls class="w-full h-auto rounded-none"><source src="${escapeHTML(lesson.title_video_url)}" type="video/mp4"></video>
                      </div>`
                        : ""
                    }
                    <p class="text-stone-500 text-xs font-light leading-relaxed mb-4 text-justify">${escapeHTML(lesson.description || "")}</p>
                </div>
                <div class="flex items-center justify-between mt-6 pt-4 border-t border-stone-100">
                    <span class="text-lg font-medium text-stone-900 tracking-wide">${lesson.price} ₽</span>
                    <button onclick="buyLesson('${lesson.lessonId}')" class="border border-stone-900 text-stone-900 text-xs font-medium uppercase tracking-widest px-5 py-2.5 hover:bg-stone-900 hover:text-white transition rounded-none cursor-pointer">В корзину</button>
                </div>
            `;
            container.appendChild(card);
          }
        } catch (error) {
          statusText.innerText = "Ошибка подключения к бэкенду.";
        }
      }

      function buyLesson(id) {
        alert(`Покупка урока: ${id}`);
      }
      function escapeHTML(str) {
        return str.replace(
          /[&<>'"]/g,
          (tag) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "'",
              '"': "&quot;",
            })[tag] || tag,
        );
      }
      document.addEventListener("DOMContentLoaded", loadLessons);
    </script>
  </body>
</html>
